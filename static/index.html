<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猫娘姐妹：幸存者</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='18' r='10' fill='%23ff7bac'/%3E%3Cpath d='M8 12 L10 3 L16 9 Z M24 12 L22 3 L16 9 Z' fill='%23ff7bac'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 700px at 50% 30%, #2a1436 0%, #14091f 60%, #0b0612 100%);
    color: #ffe3f2; font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  .hero { text-align: center; max-width: 640px; padding: 24px; }
  h1 { font-size: 44px; letter-spacing: 4px; color: #ff7bac; text-shadow: 0 0 24px rgba(255,123,172,.45); }
  .sub { margin-top: 10px; font-size: 15px; color: #d9b8d6; line-height: 1.8; }
  .keys {
    margin: 26px auto 0; display: inline-flex; flex-wrap: wrap; gap: 10px; justify-content: center;
    font-size: 13px; color: #c9aed0;
  }
  .keys span { border: 1px solid rgba(255,123,172,.35); border-radius: 999px; padding: 5px 14px; background: rgba(255,123,172,.08); }
  .keys b { color: #ffd6e7; }
  #play {
    margin-top: 30px; font-size: 20px; padding: 14px 58px; border-radius: 999px; cursor: pointer;
    border: 2px solid #ff7bac; color: #2a0d1c; font-weight: 700; letter-spacing: 6px;
    background: linear-gradient(180deg, #ffb3d1, #ff7bac);
    box-shadow: 0 6px 30px rgba(255,123,172,.4); transition: transform .12s ease;
  }
  #play:hover { transform: translateY(-2px) scale(1.03); }
  .foot { margin-top: 22px; font-size: 12px; color: #8d7396; }
  #frame-wrap { display: none; position: fixed; inset: 0; background: #000; }
  #frame-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
  <div class="hero" id="hero">
    <h1>猫娘姐妹</h1>
    <div class="sub">
      弹幕生存肉鸽 · NEKO Sisters<br>
      在 20 波围攻中活下来，收集材料，把武器合成到传说品质。<br>
      噩梦难度还藏着一个隐藏 Boss。
    </div>
    <div class="keys">
      <span><b>WASD</b> / 方向键 移动</span>
      <span><b>武器自动开火</b></span>
      <span><b>按住左键</b> 所有武器瞄准鼠标方向</span>
      <span><b>ESC</b> 暂停</span>
      <span><b>M</b> 静音</span>
    </div>
    <br>
    <button id="play">开始游戏</button>
    <div class="foot">游戏完全本地运行 · 进度保存在浏览器里</div>
  </div>
  <div id="frame-wrap">
    <iframe id="game-frame" src="game/index.html" title="猫娘姐妹：幸存者"
            allow="autoplay; fullscreen" allowfullscreen></iframe>
  </div>
  <script>
    document.getElementById('play').addEventListener('click', () => {
      document.getElementById('hero').style.display = 'none';
      document.getElementById('frame-wrap').style.display = 'block';
      // 重新赋一次 src，保证每次进来都是新开局画面
      const f = document.getElementById('game-frame');
      f.src = 'game/index.html?_t=' + Date.now();
      f.focus();
    });
  </script>
</body>
</html>
